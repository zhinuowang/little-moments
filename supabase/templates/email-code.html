<!-- Little Moments — sign-in code email (paste into Supabase → Authentication → Emails, for both
     "Magic Link" and "Confirm signup"). Bilingual, text-first, one code, no links or images,
     which keeps QQ / 163 / Outlook / Gmail filters happy. -->
<div style="margin:0;padding:32px 20px;background:#FAFAF7;font-family:'Comic Sans MS','PingFang SC','Microsoft YaHei',sans-serif;color:#1F1F1F;">
  <div style="max-width:420px;margin:0 auto;background:#FFFFFF;border:2px solid #1F1F1F;border-radius:18px;padding:28px 24px;">
    <p style="margin:0 0 4px;font-size:15px;color:#8A8A86;">Little Moments ♡</p>
    <p style="margin:0 0 18px;font-size:18px;">你的登录验证码 · Your sign-in code</p>
    <p style="margin:0 0 18px;font-size:34px;letter-spacing:10px;font-family:'Courier New',monospace;font-weight:bold;">{{ .Token }}</p>
    <p style="margin:0 0 6px;font-size:14px;line-height:1.6;">在 Little Moments 里输入这 6 位数字即可登录，10 分钟内有效。</p>
    <p style="margin:0 0 18px;font-size:14px;line-height:1.6;">Type these 6 digits into Little Moments to sign in. The code works for 10 minutes.</p>
    <p style="margin:0;font-size:12px;line-height:1.6;color:#8A8A86;">如果不是你本人操作，忽略这封邮件就好，你的账户不会有任何变化。<br>If you didn't ask for this, just ignore this email — nothing will change.</p>
  </div>
</div>
